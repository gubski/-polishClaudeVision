<!--
DATA SCHEMA
words.json    -> [{ id, level, category, word, phonetic, translation:{EN,RU} }]
grammar.json  -> [{ id, level, category, title:{EN,RU}, theory:{EN,RU},
                     exercises:[{prompt,answer}, ...]  -- OR legacy prompt/answer single fields }]
textbook.json -> [{ id, level, category, title:{EN,RU}, description:{EN,RU}, pdfUrl }]
tips.json     -> [{ id, level, category, title:{EN,RU}, body:{EN,RU}, audioUrl }]

MULTI-SHARD SYNC: see manifest.json at repo root (lists shard files per
module) — if absent, the app auto-discovers words.json, words2.json,
words3.json, ... by convention. Same for grammar/textbook/tips.

MULTIPLE EXERCISES PER GRAMMAR RULE: give a rule an `exercises` array
instead of a single prompt/answer:
  "exercises": [
    { "prompt": "Ja ___ studentem.", "answer": "jestem" },
    { "prompt": "Ty ___ nauczycielem.", "answer": "jesteś" }
  ]
Old-style single prompt/answer fields still work (treated as one exercise).

pdfUrl can be a relative path in your repo (e.g. "textbooks/unit1.pdf",
resolved against the live site) or a full https:// URL.
audioUrl accepts a direct link, or a Google Drive / Dropbox share link
(auto-converted to a playable link where possible).
-->

  if (!u) return '';
  if (u.includes('drive.google.com')) {
    const m = u.match(/\/d\/([a-zA-Z0-9_-]+)/) || u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  }
  if (u.includes('dropbox.com')) {
    u = u.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
    u = u.replace(/([?&])dl=0/, '').replace(/([?&])dl=1/, '');
    return u;
  }
  return u;
}

// Resolves a possibly-relative pdfUrl against the live site origin, so we can
// HEAD-check it before dropping it into an iframe.
function resolvePdfUrl(raw) {
  if (!raw) return '';
  try { return new URL(raw, window.location.href).toString(); } catch (e) { return raw; }
}

function getItemLabel(moduleKey, item, baseLang) {
  if (moduleKey === 'vocab') return item.word || '';
  return t(item.title, baseLang);
}
function getItemSub(moduleKey, item, baseLang) {
  if (moduleKey === 'vocab') return t(item.translation, baseLang);
  if (moduleKey === 'textbook') return t(item.description, baseLang);
  return categoryLabel(item.category, baseLang);
}

// Normalizes legacy single prompt/answer grammar items into an exercises array.
function getExercises(item) {
  if (item.exercises && item.exercises.length) return item.exercises;
  if (item.prompt) return [{ prompt: item.prompt, answer: item.answer }];
  return [];
}

const FORMAT_HINTS = {
  vocab: 'word, translation, [phonetic] — one per line',
  grammar: 'title | theory | prompt1::answer1;;prompt2::answer2;;... — one rule per line (multiple exercises separated by ;;)',
  textbook: 'title | description | pdf path or URL — one per line',
  tips: 'title | tip text | audio URL (optional) | category (optional)',
};
const FORMAT_EXAMPLES = {
  vocab: 'dom, house, [dom]\nkot, cat, [kot]',
  grammar: 'Locative (Miejscownik) | Used after "w", "na", "o" for location or topic | Rozmawiamy o (nowy stół) ➔ ?::nowym stole;;Myślę o (moja praca) ➔ ?::mojej pracy',
  textbook: 'Unit 1 — Greetings | Basic greetings and everyday introductions | textbooks/unit-1-greetings.pdf',
  tips: "Nasal vowels ą, ę | Don't fully pronounce the n or m — nasalize the vowel instead | https://www.dropbox.com/s/example/nasal.mp3?dl=0 | pronunciation",
};

function keyActivate(fn) {
  return (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
}

// Dedup key: prefer `id`; fall back to a content fingerprint so shards that
// reuse ids (or that duplicate the same word/title under a different id)
// don't produce visible duplicates in the list.
function dedupKey(moduleKey, item) {
  if (item && item.id) return `id:${item.id}`;
  if (moduleKey === 'vocab') return `w:${(item.word || '').trim().toLowerCase()}`;
  return `t:${t(item.title, 'EN').trim().toLowerCase()}`;
}

function mergeShardArrays(moduleKey, arrays) {
  const seen = new Set();
  const merged = [];
  arrays.forEach(arr => {
    if (!Array.isArray(arr)) return;
    arr.forEach(item => {
      const key = dedupKey(moduleKey, item);
      if (seen.has(key)) return;
      seen.add(key);
      merged.push(item);
    });
  });
  return merged;
}

function UniversalPolishEngine() {
  const [step, setStep] = useState('welcome'); // welcome | menu | category | hub | detail
  const [level, setLevel] = useState('A1');
  const [baseLang, setBaseLang] = useState('EN');
  const [activeModule, setActiveModule] = useState('grammar');
  const [currentItem, setCurrentItem] = useState(null);
  const [grammarPhase, setGrammarPhase] = useState('theory');
  const [exerciseIndex, setExerciseIndex] = useState(0);
  const [customVocab, setCustomVocab] = useState(() => JSON.parse(localStorage.getItem('uni_vocab_v5') || '[]'));
  const [customGrammar, setCustomGrammar] = useState(() => JSON.parse(localStorage.getItem('uni_grammar_v5') || '[]'));
  const [customTextbook, setCustomTextbook] = useState(() => JSON.parse(localStorage.getItem('uni_textbook_v1') || '[]'));
  const [customTips, setCustomTips] = useState(() => JSON.parse(localStorage.getItem('uni_tips_v1') || '[]'));
  const [showImportModal, setShowImportModal] = useState(false);
  const [importText, setImportText] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [userInput, setUserInput] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [isSyncing, setIsSyncing] = useState(false);
  const [toast, setToast] = useState(null);
  const [pdfState, setPdfState] = useState({ status: 'idle', url: '' }); // idle | checking | ok | missing

  useEffect(() => {
    localStorage.setItem('uni_vocab_v5', JSON.stringify(customVocab));
    localStorage.setItem('uni_grammar_v5', JSON.stringify(customGrammar));
    localStorage.setItem('uni_textbook_v1', JSON.stringify(customTextbook));
    localStorage.setItem('uni_tips_v1', JSON.stringify(customTips));
  }, [customVocab, customGrammar, customTextbook, customTips]);

  useEffect(() => {
    if (!toast) return;
    const timer = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(timer);
  }, [toast]);

  const showToast = (message, tone) => setToast({ message, tone: tone || 'success' });

  const masterGrammar = useMemo(() => [...INITIAL_CURRICULUM.grammar, ...customGrammar], [customGrammar]);
  const masterVocab = useMemo(() => [...INITIAL_CURRICULUM.vocab, ...customVocab], [customVocab]);
  const masterTextbook = useMemo(() => [...INITIAL_CURRICULUM.textbook, ...customTextbook], [customTextbook]);
  const masterTips = useMemo(() => [...INITIAL_CURRICULUM.tips, ...customTips], [customTips]);
  const DATASETS = { grammar: masterGrammar, vocab: masterVocab, textbook: masterTextbook, tips: masterTips };
  const activeData = DATASETS[activeModule] || [];

  const categories = useMemo(() => {
    const set = new Set(activeData.map(i => i.category).filter(Boolean));
    return Array.from(set);
  }, [activeData]);

  const filteredData = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return activeData.filter(item => {
      if (item.level !== level) return false;
      if (categoryFilter !== 'all' && item.category !== categoryFilter) return false;
      if (!q) return true;
      const label = getItemLabel(activeModule, item, baseLang).toLowerCase();
      const sub = getItemSub(activeModule, item, baseLang).toLowerCase();
      return label.includes(q) || sub.includes(q);
    });
  }, [activeData, searchQuery, categoryFilter, level, baseLang, activeModule]);

  // Categories + counts (at the current level) for the category-picker grid.
  const categoryCards = useMemo(() => {
    return categories.map(cat => ({
      key: cat,
      count: activeData.filter(i => i.category === cat && i.level === level).length,
    })).filter(c => c.count > 0);
  }, [categories, activeData, level]);

  // ---- Cloud sync: manifest.json first, auto-discovery fallback ----
  const REPO_USER = 'gubski';
  const REPO_NAME = '-polishClaudeVision'; // <-- update this if you rename/move the repo

  const rawUrl = (file) => `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/${file}`;

  const fetchJsonOrNull = async (file) => {
    try {
      const res = await fetch(rawUrl(file), { cache: 'no-store' });
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data) ? data : null;
    } catch (e) {
      return null;
    }
  };

  const autoDiscoverShards = async (base) => {
    const files = [];
    const first = await fetchJsonOrNull(`${base}.json`);
    if (first) files.push({ file: `${base}.json`, data: first });
    let n = 2;
    while (n <= 50) {
      const data = await fetchJsonOrNull(`${base}${n}.json`);
      if (!data) break;
      files.push({ file: `${base}${n}.json`, data });
      n += 1;
    }
    return files;
  };

  const fetchManifest = async () => {
    try {
      const res = await fetch(rawUrl('manifest.json'), { cache: 'no-store' });
      if (!res.ok) return null;
      const data = await res.json();
      return (data && typeof data === 'object') ? data : null;
    } catch (e) {
      return null;
    }
  };

  const handleCloudSyncFromGitHub = async () => {
    setIsSyncing(true);

    const applyMap = { vocab: setCustomVocab, grammar: setCustomGrammar, textbook: setCustomTextbook, tips: setCustomTips };
    const labelMap = { vocab: ui(baseLang, 'wordsLabel'), grammar: ui(baseLang, 'grammarLabel'), textbook: ui(baseLang, 'textbookLabel'), tips: ui(baseLang, 'tipsLabel') };
    const okMsgs = [];
    const missing = [];

    const manifest = await fetchManifest();

    for (const moduleKey of Object.keys(MODULE_FILE_BASE)) {
      const base = MODULE_FILE_BASE[moduleKey];
      let shardResults = [];

      if (manifest && Array.isArray(manifest[moduleKey]) && manifest[moduleKey].length) {
        const fetched = await Promise.all(manifest[moduleKey].map(async (file) => ({ file, data: await fetchJsonOrNull(file) })));
        shardResults = fetched.filter(r => r.data);
      } else {
        shardResults = await autoDiscoverShards(base);
      }

      if (shardResults.length) {
        const merged = mergeShardArrays(moduleKey, shardResults.map(r => r.data));
        applyMap[moduleKey](merged);
        okMsgs.push(`${merged.length} ${labelMap[moduleKey]}`);
      } else {
        missing.push(`${base}.json`);
      }
    }

    setIsSyncing(false);
    if (okMsgs.length) {
      let msg = `${ui(baseLang, 'syncedPrefix')} ${okMsgs.join(', ')}.`;
      if (manifest) msg += ` ${ui(baseLang, 'viaManifest')}`;
      if (missing.length) msg += ` — ${ui(baseLang, 'nothingFoundFor')}: ${missing.join(', ')}`;
      showToast(msg, 'success');
    } else {
      showToast(ui(baseLang, 'syncFail'), 'error');
    }
  };

  const finishImport = (count, label) => {
    if (count > 0) {
      setImportText('');
      setShowImportModal(false);
      showToast(ui(baseLang, 'saved', count, label), 'success');
    } else {
      showToast(ui(baseLang, 'noValidLines'), 'error');
    }
  };

  const handleImport = () => {
    if (!importText.trim()) return;
    const lines = importText.split('\n').map(l => l.trim()).filter(Boolean);
    if (activeModule === 'vocab') {
      const items = lines.map((line, idx) => {
        const [w, tr, p] = line.split(',').map(s => (s || '').trim());
        return w && tr ? { id: `v-imp-${Date.now()}-${idx}`, level, category: 'nouns', word: w, phonetic: p || '[import]', translation: { EN: tr, RU: tr } } : null;
      }).filter(Boolean);
      if (items.length) setCustomVocab(prev => [...items, ...prev]);
      finishImport(items.length, ui(baseLang, 'wordsLabel'));
    } else if (activeModule === 'grammar') {
      const items = lines.map((line, idx) => {
        const parts = line.split('|').map(s => (s || '').trim());
        let title, theory, exercises;
        if (parts.length >= 4) {
          // legacy: title | theory | prompt | answer
          const [ti, th, pr, an] = parts;
          title = ti; theory = th; exercises = pr ? [{ prompt: pr, answer: an }] : [];
        } else {
          const [ti, th, exRaw] = parts;
          title = ti; theory = th;
          exercises = (exRaw || '').split(';;').map(pair => {
            const [pr, an] = pair.split('::').map(s => (s || '').trim());
            return pr && an ? { prompt: pr, answer: an } : null;
          }).filter(Boolean);
        }
        return title && exercises.length ? { id: `g-imp-${Date.now()}-${idx}`, level, category: 'custom', title: { EN: title, RU: title }, theory: { EN: theory || '', RU: theory || '' }, exercises } : null;
      }).filter(Boolean);
      if (items.length) setCustomGrammar(prev => [...items, ...prev]);
      finishImport(items.length, ui(baseLang, 'grammarLabel'));
    } else if (activeModule === 'textbook') {
      const items = lines.map((line, idx) => {
        const [title, description, pdfUrl, category] = line.split('|').map(s => (s || '').trim());
        return title && pdfUrl ? { id: `tb-imp-${Date.now()}-${idx}`, level, category: category || 'chapters', title: { EN: title, RU: title }, description: { EN: description || '', RU: description || '' }, pdfUrl } : null;
      }).filter(Boolean);
      if (items.length) setCustomTextbook(prev => [...items, ...prev]);
      finishImport(items.length, ui(baseLang, 'textbookLabel'));
    } else if (activeModule === 'tips') {
      const items = lines.map((line, idx) => {
        const [title, body, audioUrl, category] = line.split('|').map(s => (s || '').trim());
        return title && body ? { id: `tip-imp-${Date.now()}-${idx}`, level, category: category || 'general', title: { EN: title, RU: title }, body: { EN: body, RU: body }, audioUrl: audioUrl || '' } : null;
      }).filter(Boolean);
      if (items.length) setCustomTips(prev => [...items, ...prev]);
      finishImport(items.length, ui(baseLang, 'tipsLabel'));
    }
  };

  const handleCheck = () => {
    if (!currentItem) return;
    const exercises = getExercises(currentItem);
    const current = exercises[exerciseIndex] || {};
    if (userInput.toLowerCase().trim() === (current.answer || '').toLowerCase()) {
      setFeedback({ correct: true, msg: ui(baseLang, 'correctMsg') });
    } else {
      setFeedback({ correct: false, msg: ui(baseLang, 'tryAgain', current.answer) });
    }
  };

  const handleNextExercise = () => {
    if (!currentItem) return;
    const exercises = getExercises(currentItem);
    setExerciseIndex(prev => (prev + 1) % exercises.length);
    setUserInput('');
    setFeedback(null);
  };

  const openModule = (key) => {
    setActiveModule(key);
    setSearchQuery('');
    setShowImportModal(false);
    setImportText('');
    const cats = Array.from(new Set((DATASETS[key] || []).map(i => i.category).filter(Boolean)));
    setCategoryFilter('all');
    setStep(cats.length > 1 ? 'category' : 'hub');
  };

  const openCategory = (cat) => {
    setCategoryFilter(cat);
    setSearchQuery('');
    setStep('hub');
  };

  const backFromHub = () => {
    setStep(categories.length > 1 ? 'category' : 'menu');
  };

  const openItem = (item) => {
    setCurrentItem(item);
    setExerciseIndex(0);
    if (activeModule === 'grammar') { setGrammarPhase('theory'); setFeedback(null); setUserInput(''); }
    if (activeModule === 'textbook') checkPdf(item.pdfUrl);
    setStep('detail');
  };

  // HEAD-checks a pdfUrl (resolved to an absolute URL) before rendering the
  // iframe, so a missing file shows a clear message instead of a blank/broken
  // frame or a browser-level 404 inside the iframe.
  const checkPdf = async (rawPdfUrl) => {
    if (!rawPdfUrl) { setPdfState({ status: 'idle', url: '' }); return; }
    const absolute = resolvePdfUrl(rawPdfUrl);
    setPdfState({ status: 'checking', url: absolute });
    try {
      const res = await fetch(absolute, { method: 'HEAD' });
      if (res.ok) {
        setPdfState({ status: 'ok', url: absolute });
      } else {
        const res2 = await fetch(absolute, { method: 'GET' });
        setPdfState({ status: res2.ok ? 'ok' : 'missing', url: absolute });
      }
    } catch (e) {
      setPdfState({ status: 'missing', url: absolute });
    }
  };

  const currentModuleCfg = MODULES.find(m => m.key === activeModule) || MODULES[0];
  const headerAccent = (step === 'hub' || step === 'detail' || step === 'category') ? currentModuleCfg.accent : '#A32638';

  const renderWelcome = () => (
    <div className="hero">
      <div className="hero-stamp">{level}<span className="hero-stamp-sub">{ui(baseLang, 'level')}</span></div>
      <h1 className="hero-title">{ui(baseLang, 'heroTitle')}</h1>
      <p className="hero-sub">{ui(baseLang, 'heroSub')}</p>
      <div className="hero-actions">
        <button className="btn btn-primary" onClick={() => setStep('menu')}>{ui(baseLang, 'openVault')}</button>
        <button className="btn btn-dark" disabled={isSyncing} onClick={handleCloudSyncFromGitHub}>{isSyncing ? ui(baseLang, 'syncing') : ui(baseLang, 'syncButton')}</button>
      </div>
    </div>
  );

  const renderMenu = () => (
    <div className="content-pad">
      <button className="link-back" onClick={() => setStep('welcome')}>{ui(baseLang, 'back')}</button>
      <div className="flex-between">
        <h2 className="menu-title">{ui(baseLang, 'selectDossier')}</h2>
      </div>
      <div className="menu-grid">
        {MODULES.map(m => (
          <div key={m.key} className="menu-card" style={{ '--accent': m.accent }}
            role="button" tabIndex={0} onClick={() => openModule(m.key)} onKeyDown={keyActivate(() => openModule(m.key))}>
            <span className="icon">{m.icon}</span>
            <span className="title">{t(m.label, baseLang)}</span>
            <span className="count">{DATASETS[m.key].filter(i => i.level === level).length} — {level}</span>
          </div>
        ))}
      </div>
    </div>
  );

  const renderCategoryGrid = () => (
    <div className="content-pad">
      <button className="link-back" onClick={() => setStep('menu')}>{ui(baseLang, 'back')}</button>
      <div className="flex-between">
        <h2 className="menu-title">{t(currentModuleCfg.label, baseLang)} — {ui(baseLang, 'selectCategory')}</h2>
      </div>
      <div className="menu-grid">
        <div className="menu-card" style={{ '--accent': currentModuleCfg.accent }}
          role="button" tabIndex={0} onClick={() => openCategory('all')} onKeyDown={keyActivate(() => openCategory('all'))}>
          <span className="icon">🗂️</span>
          <span className="title">{ui(baseLang, 'allCategories')}</span>
          <span className="count">{activeData.filter(i => i.level === level).length} — {level}</span>
        </div>
        {categoryCards.map(c => (
          <div key={c.key} className="menu-card" style={{ '--accent': currentModuleCfg.accent }}
            role="button" tabIndex={0} onClick={() => openCategory(c.key)} onKeyDown={keyActivate(() => openCategory(c.key))}>
            <span className="icon">{categoryIcon(c.key)}</span>
            <span className="title">{categoryLabel(c.key, baseLang)}</span>
            <span className="count">{c.count} — {level}</span>
          </div>
        ))}
      </div>
    </div>
  );

  const renderImportModal = () => (
    <div className="modal">
      <p className="modal-hint">{ui(baseLang, 'modalHint', FORMAT_HINTS[activeModule], level)}</p>
      <textarea className="field textarea" rows="5" value={importText} onChange={e => setImportText(e.target.value)} placeholder={FORMAT_EXAMPLES[activeModule]} />
      <div className="flex-gap">
        <button className="btn btn-primary" onClick={handleImport}>{ui(baseLang, 'save', t(currentModuleCfg.label, baseLang))}</button>
        <button className="btn btn-ghost" onClick={() => { setShowImportModal(false); setImportText(''); }}>{ui(baseLang, 'cancel')}</button>
      </div>
    </div>
  );

  const renderHub = () => (
    <div className="content-pad">
      <button className="link-back" onClick={backFromHub}>{ui(baseLang, 'back')}</button>
      <div className="flex-between">
        <h3 className="section-title">
          {t(currentModuleCfg.label, baseLang)}
          {categoryFilter !== 'all' && <> · {categoryLabel(categoryFilter, baseLang)}</>}
          {' '}<span className="muted-sm">({filteredData.length})</span>
        </h3>
        <button className="btn btn-dark" onClick={() => setShowImportModal(s => !s)}>{ui(baseLang, 'batchImport')}</button>
      </div>
      {showImportModal ? renderImportModal() : (
        <>
          <div className="filter-row">
            <input className="field" placeholder={`${ui(baseLang, 'searchPrefix')} ${t(currentModuleCfg.label, baseLang).toLowerCase()}...`} value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
            {categories.length > 1 && (
              <select className="field select-narrow" value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
                <option value="all">{ui(baseLang, 'allCategories')}</option>
                {categories.map(c => <option key={c} value={c}>{categoryLabel(c, baseLang)}</option>)}
              </select>
            )}
          </div>
          <div className="list-scroll">
            {filteredData.length === 0 && <p className="empty-note">{ui(baseLang, 'nothingHere', level)}</p>}
            {filteredData.map(item => (
              <div key={item.id} className="list-item" role="button" tabIndex={0}
                onClick={() => openItem(item)} onKeyDown={keyActivate(() => openItem(item))}>
                <div>
                  <strong>{getItemLabel(activeModule, item, baseLang)}</strong>
                  <div className="sub">{getItemSub(activeModule, item, baseLang)}</div>
                </div>
                <span className="chev">›</span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );

  const renderGrammarDetail = (item) => {
    const exercises = getExercises(item);
    const current = exercises[exerciseIndex] || {};
    return (
      <div className="detail-center">
        {grammarPhase === 'theory' ? (
          <div className="detail-box">
            <h3 className="detail-title">{t(item.title, baseLang)}</h3>
            <p className="detail-theory">{t(item.theory, baseLang)}</p>
            <button className="btn btn-primary" onClick={() => setGrammarPhase('practice')}>{ui(baseLang, 'practiceExercise')}</button>
          </div>
        ) : (
          <div className="detail-box narrow">
            {exercises.length > 1 && <p className="exercise-progress">{ui(baseLang, 'exerciseProgress', exerciseIndex + 1, exercises.length)}</p>}
            <p className="prompt">{current.prompt}</p>
            <input className="field center-text" value={userInput} onChange={e => setUserInput(e.target.value)} placeholder={ui(baseLang, 'typeAnswer')} onKeyDown={e => e.key === 'Enter' && handleCheck()} />
            {feedback && <p className={`feedback ${feedback.correct ? 'ok' : 'bad'}`}>{feedback.msg}</p>}
            <button className="btn btn-primary full" onClick={handleCheck}>{ui(baseLang, 'checkAnswer')}</button>
            {exercises.length > 1 && (
              <button className="btn btn-secondary full" style={{ marginTop: '8px' }} onClick={handleNextExercise}>{ui(baseLang, 'nextExercise')}</button>
            )}
          </div>
        )}
      </div>
    );
  };

  const renderVocabDetail = (item) => (
    <div className="detail-center">
      <div className="flash-card">
        <h2 className="flash-word">{item.word}</h2>
        <span className="tag mono">{item.phonetic}</span>
        <p className="flash-translation">{t(item.translation, baseLang)}</p>
      </div>
    </div>
  );

  const renderTextbookDetail = (item) => (
    <div className="detail-stack">
      <h3 className="detail-title">{t(item.title, baseLang)}</h3>
      <p className="detail-desc">{t(item.description, baseLang)}</p>
      {!item.pdfUrl && <p className="empty-note">{ui(baseLang, 'noPdfYet')}</p>}
      {item.pdfUrl && pdfState.status === 'checking' && <p className="pdf-status">{ui(baseLang, 'checkingPdf')}</p>}
      {item.pdfUrl && pdfState.status === 'missing' && (
        <div className="pdf-error">
          {ui(baseLang, 'pdfErrorTitle')}<br />
          {ui(baseLang, 'expectedAt')} <code>{pdfState.url}</code><br />
          {ui(baseLang, 'pdfErrorHint')}
        </div>
      )}
      {item.pdfUrl && pdfState.status === 'ok' && (
        <>
          <div className="pdf-frame-wrap">
            <iframe src={pdfState.url} title={t(item.title, baseLang)} className="pdf-frame" />
          </div>
          <a className="btn btn-ghost" href={pdfState.url} target="_blank" rel="noreferrer">{ui(baseLang, 'openNewTab')}</a>
        </>
      )}
    </div>
  );

  const renderTipsDetail = (item) => {
    const audio = normalizeAudioUrl(item.audioUrl);
    return (
      <div className="detail-stack">
        <h3 className="detail-title">{t(item.title, baseLang)}</h3>
        <p className="detail-theory">{t(item.body, baseLang)}</p>
        {audio ? <audio controls src={audio} className="audio-player" /> : <p className="empty-note">{ui(baseLang, 'noAudio')}</p>}
      </div>
    );
  };

  const renderDetail = () => {
    if (!currentItem) return null;
    if (activeModule === 'grammar') return renderGrammarDetail(currentItem);
    if (activeModule === 'vocab') return renderVocabDetail(currentItem);
    if (activeModule === 'textbook') return renderTextbookDetail(currentItem);
    if (activeModule === 'tips') return renderTipsDetail(currentItem);
    return null;
  };

  return (
    <div className="vault-shell">
      <div className="dossier-wrap">
        {step !== 'welcome' && (
          <div className="tab-row">
            {MODULES.map(m => (
              <div key={m.key} className={`tab ${activeModule === m.key && (step === 'hub' || step === 'detail' || step === 'category') ? 'active' : ''}`}
                role="button" tabIndex={0} onClick={() => openModule(m.key)} onKeyDown={keyActivate(() => openModule(m.key))}>
                <span>{m.icon}</span><span>{t(m.label, baseLang)}</span>
              </div>
            ))}
          </div>
        )}
        <div className={`card ${step === 'welcome' ? 'no-tabs' : ''}`}>
          <div className="header" style={{ '--accent': headerAccent }}>
            <button className="logo" onClick={() => setStep('welcome')}>🇵🇱 Polska Vault</button>
            <div className="chip-group">
              <select className="chip-select" value={level} onChange={e => setLevel(e.target.value)}>
                {['A1', 'A2', 'B1'].map(l => <option key={l} value={l}>{l}</option>)}
              </select>
              <select className="chip-select" value={baseLang} onChange={e => setBaseLang(e.target.value)}>
                <option value="EN">EN</option>
                <option value="RU">RU</option>
              </select>
            </div>
          </div>
          {step === 'welcome' && renderWelcome()}
          {step === 'menu' && renderMenu()}
          {step === 'category' && renderCategoryGrid()}
          {step === 'hub' && renderHub()}
          {step === 'detail' && (
            <div className="detail-wrap">
              <div className="status-bar">
                <button className="link-back" onClick={() => setStep('hub')}>{ui(baseLang, 'back')}</button>
                <span className="muted-sm">{t(currentModuleCfg.label, baseLang)}</span>
              </div>
              {renderDetail()}
            </div>
          )}
        </div>
      </div>
      {toast && <div className={`toast ${toast.tone === 'error' ? 'error' : ''}`}>{toast.message}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<UniversalPolishEngine />);
</script>
</body>
</html>
