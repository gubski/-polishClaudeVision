<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polska — Grammar, Vocabulary, Textbook &amp; Tutor Tips</title>
<!--
DESIGN: 3D Liquid Glassmorphism, per Polish_Learning_App_Design_Spec.docx.
Palette: deep indigo-navy base (#0B1020 → #161B33) so glass panels & neon
section tints (azure/emerald/amber/violet) actually pop via refraction.
Type: Plus Jakarta Sans throughout (display + body, weight does the work),
Space Mono only for small numeric labels (streak, level, counts).

DATA SCHEMA (kept in sync with words.json / grammar.json / textbook.json /
tips.json in THIS SAME repo — "Sync from Cloud" reads the repo name from
the current page URL, so it always points at wherever this file lives).

words.json    -> [{ id, level, category, word, phonetic, translation:{EN,RU},
                     gender?: 'm'|'f'|'n', examples?: [string, string] }]
grammar.json  -> [{ id, level, category, title:{EN,RU}, theory:{EN,RU},
                     type?: 'fill'|'mcq' (default 'fill'),
                     prompt, answer,            // used when type is 'fill'
                     options?: [string,...] }]  // used when type is 'mcq' (answer is the correct option text)
textbook.json -> [{ id, level, category, title:{EN,RU}, description:{EN,RU}, fileUrl }]
  fileUrl accepts a Google Drive / Dropbox share link (auto-converted to an
  inline preview) or a direct https:// URL / repo-relative path.
tips.json     -> [{ id, level, category, title:{EN,RU}, body:{EN,RU},
                     audioUrl?, imageUrl? }]
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/fill/style.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --void:#0A0D16; --bg-1:#131A32; --bg-2:#1B2444;
  --ink:#F6F3EE; --ink-dim:#AFB8D6; --ink-faint:#7C86AC;
  --glass-fill:rgba(246,243,238,.07); --glass-fill-hi:rgba(246,243,238,.13);
  --glass-border:rgba(246,243,238,.16); --glass-border-hi:rgba(246,243,238,.30);
  --glass-shadow:0 20px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);

  --violet:#3B1E6B; --blue:#12294D; --crimson:#C8203D;
  --accent:#E8536A;

  --grammar-a:#2F7BFF;  --grammar-b:#5FD4FF;
  --vocab-a:#12B886;    --vocab-b:#8CF2C7;
  --textbook-a:#F0A73C; --textbook-b:#F2B9A0;
  --tips-a:#8A4FEE;     --tips-b:#EA7CF0;
  --profile-a:#E8536A;  --profile-b:#FF9E9E;

  --good:#3ED598; --bad:#FF6B7A;
  --font-display:'Bricolage Grotesque', sans-serif;
  --font-ui:'Manrope', sans-serif;
  --font-mono:'Space Mono', monospace;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  margin:0; font-family:var(--font-ui); color:var(--ink);
  background:var(--void);
  overflow-x:hidden;
}
/* Liquid-glass mesh background: large blurred blobs drifting on transform only
   (compositor-thread animation, no layout thrash) — oversized + inset-negative
   so drifting never reveals a hard edge. */
.mesh{ position:fixed; inset:-10%; z-index:0; pointer-events:none; background:var(--void); }
.mesh::before, .mesh::after, .mesh .blob-c{
  content:''; position:absolute; border-radius:50%; filter:blur(90px); opacity:.6; will-change:transform;
}
.mesh::before{ width:70vw; height:70vw; left:-15vw; top:-10vh; background:radial-gradient(circle, var(--violet), transparent 70%); animation:driftA 26s ease-in-out infinite; }
.mesh::after{ width:65vw; height:65vw; right:-20vw; top:20vh; background:radial-gradient(circle, var(--blue), transparent 70%); animation:driftB 32s ease-in-out infinite; }
.mesh .blob-c{ width:55vw; height:55vw; left:20vw; bottom:-25vh; background:radial-gradient(circle, var(--crimson), transparent 72%); opacity:.35; animation:driftC 38s ease-in-out infinite; }
@keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(8vw,10vh) scale(1.15); } }
@keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-10vw,-6vh) scale(1.08); } }
@keyframes driftC{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6vw,-8vh) scale(1.12); } }
@media (prefers-reduced-motion:reduce){ .mesh::before, .mesh::after, .mesh .blob-c{ animation:none; } }

/* ---------- Full-screen app shell (liquid-glass-demo architecture) ---------- */
#app{ position:relative; width:100vw; height:100dvh; overflow:hidden; isolation:isolate; }

/* Compact global HUD — brand, level, language only; stats live in Profile */
.topbar-compact{
  position:relative; z-index:5; margin:0; border-radius:0; border-left:none; border-right:none; border-top:none;
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  display:flex; align-items:center; gap:10px;
}
.topbar-compact .brand{ margin-right:auto; }
.topbar-compact .level-select{ width:60px; padding:6px 8px; font-size:12px; }
.ph-spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.view{
  position:absolute; z-index:1;
  top:58px; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom));
  overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;
  max-width:760px; margin:0 auto;
}
.view::-webkit-scrollbar{ display:none; }

/* ---------- Glass dock ---------- */
.dock{
  position:fixed; z-index:10; display:flex; gap:4px; padding:8px;
  left:50%; bottom:calc(env(safe-area-inset-bottom) + 14px); transform:translateX(-50%);
  border-radius:100px;
}
.dock-item{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  width:74px; padding:10px 4px 9px; border-radius:100px;
  color:var(--ink-faint); background:transparent; border:none; cursor:pointer;
  font-family:var(--font-ui); transition:color .2s ease, background .2s ease, transform .15s ease;
}
.dock-item:active{ transform:scale(.94); }
.dock-item i{ font-size:22px; }
.dock-item span{ font-size:10.5px; font-weight:700; }
.dock-item.active{ color:var(--ink); background:var(--glass-fill-hi); }
@media (min-width:900px){
  .dock{ left:24px; top:50%; bottom:auto; transform:translateY(-50%); flex-direction:column; border-radius:30px; padding:18px 10px; gap:14px; }
  .dock-item{ width:92px; padding:14px 6px 12px; }
  .dock-item i{ font-size:26px; }
  .dock-item span{ font-size:11.5px; }
  .view{ left:150px; right:28px; max-width:800px; }
}

.toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:12px 20px; border-radius:14px; font-size:12.5px; z-index:50; max-width:90vw; animation:toastIn .28s cubic-bezier(.2,.9,.3,1.3); }

/* ---------- Glass primitives ---------- */
.glass{
  background:var(--glass-fill); backdrop-filter:blur(28px) saturate(160%); -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--glass-border); border-radius:var(--r-lg);
  box-shadow:var(--glass-shadow);
}
@media (prefers-reduced-transparency:reduce){
  .glass{ background:var(--bg-1); backdrop-filter:none; -webkit-backdrop-filter:none; }
  .glass-hi, .glass-btn.ghost, .field, .mcq-option{ background:var(--bg-2) !important; }
}
.icon, .section-card .icon, .choice-card .icon, .avatar-ring, .tip-thumb{ font-style:normal; }
.glass-tight{ border-radius:var(--r-md); }
.glass-btn{
  font-family:var(--font-ui); font-weight:700; font-size:14px; letter-spacing:.1px;
  color:var(--ink); background:var(--glass-fill-hi); border:1px solid var(--glass-border-hi);
  border-radius:100px; padding:13px 22px; cursor:pointer; text-align:center;
  backdrop-filter:blur(14px); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.glass-btn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.5); }
.glass-btn:active{ transform:translateY(0); }
.glass-btn.primary{ background:linear-gradient(135deg, var(--accent-a, var(--grammar-a)), var(--accent-b, var(--grammar-b))); color:#0B1020; border-color:transparent; box-shadow:0 10px 30px color-mix(in srgb, var(--accent-a, var(--grammar-a)) 45%, transparent); }
.glass-btn.ghost{ background:transparent; box-shadow:none; }
.glass-btn.block{ width:100%; }
.glass-btn:disabled{ opacity:.5; cursor:default; transform:none; }
.icon-btn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass-fill-hi); border:1px solid var(--glass-border); color:var(--ink); cursor:pointer; font-size:16px; flex-shrink:0; }
.field{ width:100%; padding:15px 16px; border-radius:14px; border:1px solid var(--glass-border); background:rgba(255,255,255,.06); color:var(--ink); font-family:var(--font-ui); font-size:15.5px; outline:none; }
.field option{ background:var(--bg-1); color:var(--ink); }
.field::placeholder{ color:var(--ink-faint); }
.field:focus{ border-color:var(--accent-a, var(--grammar-a)); }
.textarea{ font-family:var(--font-mono); resize:vertical; }
.mono{ font-family:var(--font-mono); }
button, [role="button"]{ outline:none; }
button:focus-visible, [role="button"]:focus-visible, .field:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

.top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; }
.brand .flag{ font-size:18px; }
.lang-toggle{ display:flex; gap:4px; background:var(--glass-fill); border:1px solid var(--glass-border); border-radius:100px; padding:3px; }
.lang-toggle button{ border:none; background:transparent; color:var(--ink-faint); font-family:var(--font-mono); font-weight:700; font-size:11px; padding:6px 10px; border-radius:100px; cursor:pointer; }
.lang-toggle button.active{ background:#fff; color:#0B1020; }

/* ---------- Main Menu ---------- */
.menu-hero{ padding:38px 26px; text-align:center; display:flex; flex-direction:column; align-items:center; }
.avatar-ring{ width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; background:linear-gradient(135deg, var(--grammar-a), var(--tips-a)); box-shadow:0 0 0 5px rgba(255,255,255,.08), 0 14px 34px rgba(90,90,255,.35); margin-bottom:16px; }
.hero-title{ font-family:var(--font-display); font-size:32px; font-weight:700; margin:0 0 6px; letter-spacing:-.4px; }
.hero-sub{ color:var(--ink-dim); font-size:15px; max-width:340px; line-height:1.6; margin:0 0 22px; }
.stat-row{ display:flex; gap:10px; margin-bottom:26px; }
.start-screen{ position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; }
.start-card{ max-width:400px; width:100%; padding:40px 30px; border-radius:var(--r-lg); text-align:center; display:flex; flex-direction:column; align-items:center; }
.start-stats{ display:flex; gap:10px; margin-bottom:26px; width:100%; justify-content:center; }
.start-stats > div{ flex:1; max-width:100px; padding:10px 8px; border-radius:16px; background:var(--glass-fill); text-align:center; }
.start-stats span{ display:block; font-size:18px; font-weight:700; }
.start-stats small{ display:block; font-size:10px; color:var(--ink-faint); margin-top:2px; }
.start-card .glass-btn{ width:100%; }
.stat-chip{ padding:10px 16px; border-radius:16px; text-align:center; min-width:84px; }
.stat-chip .num{ font-family:var(--font-mono); font-weight:700; font-size:18px; }
.stat-chip .lbl{ font-size:10px; color:var(--ink-faint); margin-top:2px; }
.profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.profile-stat{ padding:20px 14px; border-radius:var(--r-md); display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
.profile-stat i{ font-size:22px; color:var(--accent); }
.profile-stat span{ font-family:var(--font-mono); font-size:22px; font-weight:800; }
.profile-stat small{ font-size:11px; color:var(--ink-dim); }
.menu-actions{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:240px; }

/* ---------- Section Choice Page ---------- */
.section-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:22px; }
.section-card{
  position:relative; padding:20px 16px; border-radius:var(--r-md); cursor:pointer; overflow:hidden;
  border:1px solid var(--glass-border); background:var(--glass-fill);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  display:flex; flex-direction:column; gap:10px; min-height:140px; justify-content:space-between;
}
.section-card::before{ content:''; position:absolute; inset:0; opacity:.35; background:radial-gradient(120% 120% at 20% 0%, var(--accent-a), transparent 60%); pointer-events:none; }
.section-card:hover{ transform:translateY(-4px) scale(1.015); border-color:var(--glass-border-hi); box-shadow:0 18px 40px color-mix(in srgb, var(--accent-a) 30%, transparent); }
.section-card .icon{ font-size:24px; }
.section-card .title{ font-weight:800; font-size:15.5px; position:relative; z-index:1; }
.section-card .count{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); position:relative; z-index:1; }

/* ---------- Hub / lists ---------- */
.pad{ padding:22px; }
.wotd{ padding:22px 20px; margin:0 0 18px; border-radius:var(--r-lg); }
.wotd-tag{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; }
.wotd-tag .dot{ width:6px; height:6px; border-radius:50%; }
.wotd-word{ font-family:var(--font-display); font-size:clamp(30px,8vw,40px); font-weight:700; line-height:1.05; margin:10px 0 4px; }
.wotd-phonetic{ font-size:14.5px; color:var(--ink-faint); font-style:italic; }
.wotd-translation{ display:inline-block; margin-top:14px; padding:6px 14px; border-radius:100px; border:1px solid; font-weight:700; font-size:14px; }
.wotd-sentence{ margin-top:16px; padding-top:14px; border-top:1px solid var(--glass-border); font-size:15px; line-height:1.5; color:var(--ink); }
.vocab-progress{ padding:16px 20px; margin-bottom:18px; }
.vocab-progress-top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; color:var(--ink-dim); margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em; }
.vocab-progress-top .mono{ font-family:var(--font-mono); color:var(--ink); }
.progress-track{ height:8px; border-radius:100px; background:rgba(255,255,255,.08); overflow:hidden; }
.progress-fill{ height:100%; border-radius:100px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.section-header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.section-header h2{ font-family:var(--font-display); font-size:23px; font-weight:700; margin:0; }
.back-link{ background:none; border:none; color:var(--ink-dim); font-weight:700; font-size:12.5px; cursor:pointer; padding:0; margin-bottom:14px; display:flex; align-items:center; gap:5px; transition:transform .15s ease, color .15s ease; }
.back-link:hover{ color:var(--ink); transform:translateX(-2px); }
.hub-top-bar{ display:flex; align-items:center; justify-content:space-between; padding:0 22px; margin-bottom:8px; gap:10px; }
.level-select{ width:auto; flex-shrink:0; }
.category-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.category-tile{ padding:18px 16px; border-radius:16px; cursor:pointer; font-weight:700; font-size:14.5px; }
.list-scroll{ display:flex; flex-direction:column; gap:10px; padding-right:2px; }
.glass-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-radius:18px; cursor:pointer; font-size:15px; transition:background .15s ease, transform .12s ease; }
.glass-row:hover{ background:var(--glass-fill-hi); transform:translateX(2px); }
.glass-row strong{ display:block; font-size:14px; }
.glass-row .sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
.chev{ color:var(--ink-faint); }
.empty-note{ color:var(--ink-faint); font-size:14.5px; font-style:italic; padding:16px 4px; }
.filter-row{ display:flex; gap:8px; margin-bottom:12px; }
.select-narrow{ max-width:130px; flex-shrink:0; }
.toolbar{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

/* ---------- Grammar: theory + split screen ---------- */
.theory-card{ padding:30px; }
.theory-card h3{ font-family:var(--font-display); font-size:24px; font-weight:700; margin:0 0 14px; }
.grammar-questions{ display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding:6px 13px; border-radius:100px; margin-bottom:14px; }
.phonetic-note{ display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--ink-dim); font-style:italic; margin:12px 0 0; line-height:1.5; }
.phonetic-note i{ margin-top:2px; flex-shrink:0; color:var(--ink-faint); }
.grammar-example{ margin:16px 0 20px; padding:18px 20px; border-radius:var(--r-sm); background:var(--glass-fill-hi); border-left:3px solid var(--accent); }
.grammar-example .ex-pl{ font-weight:700; font-size:17px; margin:0 0 6px; }
.grammar-example .ex-tr{ font-size:15px; color:var(--ink-dim); margin:0; font-style:italic; }
.theory-body{ font-size:16px; line-height:1.7; color:var(--ink-dim); background:rgba(255,255,255,.05); border:1px solid var(--glass-border); border-radius:16px; padding:20px; margin-bottom:20px; }
/* Theory + practice now stack full-width instead of squeezing theory into a
   narrow sticky sidebar — that sidebar was the "tiny window" people hit. */
.split{ display:flex; flex-direction:column; gap:16px; padding:22px; }
.split .theory-pane{ padding:22px; }
.split .theory-pane h4{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0 0 10px; }
.split .theory-pane p{ font-size:15px; color:var(--ink-dim); line-height:1.65; margin:0; }
.practice-pane{ padding:26px 22px; }
.prompt-text{ font-weight:700; font-size:19px; margin-bottom:20px; line-height:1.55; }
.mcq-options{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.mcq-option{ text-align:left; padding:16px 18px; border-radius:16px; border:1px solid var(--glass-border); background:rgba(255,255,255,.05); color:var(--ink); font-family:var(--font-ui); font-size:16px; cursor:pointer; }
.mcq-option:hover{ background:var(--glass-fill-hi); }
.mcq-option.correct{ border-color:var(--good); background:rgba(62,213,152,.16); }
.mcq-option.incorrect{ border-color:var(--bad); background:rgba(255,107,122,.16); }
.feedback{ font-size:14.5px; font-weight:700; margin:12px 0 0; }
.feedback.ok{ color:var(--good); }
.feedback.bad{ color:var(--bad); }

/* ---------- Vocabulary ---------- */
.two-col-choice{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:22px; }
.choice-card{ padding:32px 16px; border-radius:22px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px; }
.choice-card .icon{ font-size:30px; }
.choice-card .title{ font-weight:800; font-size:15px; }
.flash-wrap{ padding:22px; display:flex; flex-direction:column; align-items:center; }
.flash-deck{ position:relative; width:100%; max-width:320px; height:400px; margin:0 auto 20px; touch-action:pan-y; perspective:1400px; -webkit-perspective:1400px; }
.flash-card-enter{ position:absolute; inset:0; animation:cardFadeIn .35s ease both; }
.flash-card{
  position:absolute; inset:0; border-radius:28px; cursor:grab; user-select:none;
  transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1), box-shadow .6s ease;
}
.flash-card:active{ cursor:grabbing; }
@keyframes cardFadeIn{ from{ opacity:0; } to{ opacity:1; } }
.flash-face{
  position:absolute; inset:0; border-radius:28px; padding:30px 24px; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  color:#0B1020; box-shadow:0 26px 55px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.35);
  overflow:hidden;
}
.flash-face::before{ content:''; position:absolute; top:-60%; left:-20%; width:60%; height:220%; background:linear-gradient(120deg, rgba(255,255,255,.35), transparent 60%); transform:rotate(20deg); pointer-events:none; }
.flash-face.back{ transform:rotateY(180deg); -webkit-transform:rotateY(180deg); }
@media (prefers-reduced-motion:reduce){ .flash-card{ transition:none; animation:none; } }
.flash-card .gender-badge{ font-family:var(--font-mono); font-size:11px; font-weight:700; background:rgba(11,16,32,.18); padding:4px 11px; border-radius:100px; margin-bottom:12px; }
.flash-card .word{ font-family:var(--font-display); font-size:34px; font-weight:700; margin:0 0 8px; }
.flash-card .phonetic{ font-size:14px; opacity:.75; margin-bottom:14px; }
.flash-card .translation{ font-weight:700; font-size:17px; margin-bottom:12px; }
.flash-card .examples{ font-size:14px; opacity:.85; line-height:1.6; }

const ui = (key, lang, vars) => {
  const raw = (UI_STRINGS[key] && (UI_STRINGS[key][lang] || UI_STRINGS[key].EN)) || '';
  if (!vars) return raw;
  return Object.keys(vars).reduce((s, k) => s.split(`{${k}}`).join(vars[k]), raw);
};

const keyActivate = (fn) => (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
function todayStr() { return new Date().toISOString().slice(0, 10); }

const FORMAT_HINTS = {
  vocab: 'word, translation, [phonetic], [gender m/f/n], [example1;example2]',
  grammar: 'title | theory | prompt | answer | [options separated by ~ for MCQ]',
  textbook: 'title | description | Google Drive link (or URL)',
  tips: 'title | tip text | [audio URL] | [image URL] | [category]',
};
const FORMAT_EXAMPLES = {
  vocab: 'kot, cat, [kot], m, Mam kota.;Kot śpi na krześle.',
  grammar: 'Locative (Miejscownik) | Used after w/na/o for location or topic | Rozmawiamy o (nowy stół) ➔ ? | nowym stole',
  textbook: 'Unit 1 — Greetings | Basic greetings | https://drive.google.com/file/d/XXXX/view?usp=sharing',
  tips: "Nasal vowels ą, ę | Don't fully pronounce n/m — nasalize instead | https://dl.dropboxusercontent.com/s/x/nasal.mp3 | | pronunciation",
};

function PolskaVault() {
  const [level, setLevel] = useState('A1');
  const [baseLang, setBaseLang] = useState('EN');
  const [started, setStarted] = useState(false);
  const [activeModule, setActiveModule] = useState('grammar'); // dock-controlled: grammar | vocab | textbook | tips
  const [activeCategory, setActiveCategory] = useState(null);
  const [vocabMode, setVocabMode] = useState(null); // 'flash' | 'list'
  const [vocabDetailOpen, setVocabDetailOpen] = useState(false);
  const [textbookViewerOpen, setTextbookViewerOpen] = useState(false);
  const [flashIndex, setFlashIndex] = useState(0);
  const [flashFlipped, setFlashFlipped] = useState(false);
  const [sessionMastered, setSessionMastered] = useState(() => new Set());
  const [sessionFailed, setSessionFailed] = useState(() => new Set());
  const [deckDone, setDeckDone] = useState(false);
  const [dragX, setDragX] = useState(0);
  const dragging = useRef(false);
  const dragStartX = useRef(0);

  const [currentItem, setCurrentItem] = useState(null);
  const [grammarPhase, setGrammarPhase] = useState('theory');
  const [userInput, setUserInput] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [mcqChoice, setMcqChoice] = useState(null);
  const [activeTip, setActiveTip] = useState(null);

  const [customVocab, setCustomVocab] = useState(() => JSON.parse(localStorage.getItem('uni_vocab_v6') || '[]'));
  const [customGrammar, setCustomGrammar] = useState(() => JSON.parse(localStorage.getItem('uni_grammar_v6') || '[]'));
  const [customTextbook, setCustomTextbook] = useState(() => JSON.parse(localStorage.getItem('uni_textbook_v6') || '[]'));
  const [customTips, setCustomTips] = useState(() => JSON.parse(localStorage.getItem('uni_tips_v6') || '[]'));
  const [mastered, setMastered] = useState(() => new Set(JSON.parse(localStorage.getItem('uni_mastered_v1') || '[]')));
  const [streak, setStreak] = useState(() => JSON.parse(localStorage.getItem('uni_streak_v1') || '{"date":"","count":0}'));

  const [showImportModal, setShowImportModal] = useState(false);
  const [importText, setImportText] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [isSyncing, setIsSyncing] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => { localStorage.setItem('uni_vocab_v6', JSON.stringify(customVocab)); }, [customVocab]);
  useEffect(() => { localStorage.setItem('uni_grammar_v6', JSON.stringify(customGrammar)); }, [customGrammar]);
  useEffect(() => { localStorage.setItem('uni_textbook_v6', JSON.stringify(customTextbook)); }, [customTextbook]);
  useEffect(() => { localStorage.setItem('uni_tips_v6', JSON.stringify(customTips)); }, [customTips]);
  useEffect(() => { localStorage.setItem('uni_mastered_v1', JSON.stringify([...mastered])); }, [mastered]);
  useEffect(() => { localStorage.setItem('uni_streak_v1', JSON.stringify(streak)); }, [streak]);
  useEffect(() => { if (!toast) return; const timer = setTimeout(() => setToast(null), 4200); return () => clearTimeout(timer); }, [toast]);

  const showToast = (message, tone) => setToast({ message, tone: tone || 'success' });

  const bumpStreak = () => {
    const today = todayStr();
    setStreak(prev => {
      if (prev.date === today) return prev;
      const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const count = prev.date === yest ? prev.count + 1 : 1;
      return { date: today, count };
    });
  };
  const markMastered = (id) => { setMastered(prev => new Set(prev).add(id)); bumpStreak(); };

  const masterGrammar = useMemo(() =>
    [...INITIAL_CURRICULUM.grammar, ...customGrammar].flatMap(expandGrammarItem),
  [customGrammar]);
  const masterVocab = useMemo(() => [...INITIAL_CURRICULUM.vocab, ...customVocab], [customVocab]);
  const wordOfDay = useMemo(() => {
    if (!masterVocab.length) return null;
    const dayIndex = Math.floor(Date.now() / 86400000);
    return masterVocab[dayIndex % masterVocab.length];
  }, [masterVocab]);
  const vocabMasteredCount = useMemo(() => masterVocab.filter(i => mastered.has(i.id)).length, [masterVocab, mastered]);
  const vocabProgressPct = masterVocab.length ? Math.round((vocabMasteredCount / masterVocab.length) * 100) : 0;
  const masterTextbook = useMemo(() => [...INITIAL_CURRICULUM.textbook, ...customTextbook], [customTextbook]);
  const masterTips = useMemo(() => [...INITIAL_CURRICULUM.tips, ...customTips], [customTips]);
  const DATASETS = { grammar: masterGrammar, vocab: masterVocab, textbook: masterTextbook, tips: masterTips };

  const totalItems = masterGrammar.length + masterVocab.length;
  const progressPct = totalItems ? Math.round((mastered.size / totalItems) * 100) : 0;

  const activeCfg = MODULES.find(m => m.key === activeModule);
  const accentVars = activeCfg ? { '--accent-a': activeCfg.a, '--accent-b': activeCfg.b } : {};

  const activeData = DATASETS[activeModule] || [];
  const leveledData = useMemo(() => level === 'ALL' ? activeData : activeData.filter(i => i.level === level), [activeData, level]);
  const categories = useMemo(() => Array.from(new Set(leveledData.map(i => i.category).filter(Boolean))), [leveledData]);

  const filteredList = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return leveledData.filter(item => {
      if (activeModule === 'grammar' && activeCategory && item.category !== activeCategory) return false;
      if (activeModule !== 'grammar' && categoryFilter !== 'all' && item.category !== categoryFilter) return false;
      if (!q) return true;
      const label = (activeModule === 'vocab' ? item.word : t(item.title, baseLang) || '').toLowerCase();
      return label.includes(q);
    });
  }, [leveledData, searchQuery, categoryFilter, activeModule, activeCategory, baseLang]);

  const handleCloudSync = async () => {
    setIsSyncing(true);
    const host = window.location.hostname;
    const repoUser = host.split('.')[0] || 'gubski';
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const repoName = pathParts[0] || '-polishClaudeVision';
    const rawBase = `https://raw.githubusercontent.com/${repoUser}/${repoName}/main/`;
    const fetchJson = (file) => fetch(`${rawBase}${file}?t=${Date.now()}`).then(res => {
      if (!res.ok) throw new Error('missing'); return res.json();
    });

    const DEFAULTS = {
      words: ['words.json'], grammar: ['grammar.json'],
      textbook: ['textbook.json'], tips: ['tips.json'],
    };
    let fileMap = DEFAULTS;
    try {
      const manifest = await fetchJson('manifest.json');
      if (manifest && typeof manifest === 'object') {
        fileMap = {
          words: Array.isArray(manifest.words) ? manifest.words : DEFAULTS.words,
          grammar: Array.isArray(manifest.grammar) ? manifest.grammar : DEFAULTS.grammar,
          textbook: Array.isArray(manifest.textbook) ? manifest.textbook : DEFAULTS.textbook,
          tips: Array.isArray(manifest.tips) ? manifest.tips : DEFAULTS.tips,
        };
      }
    } catch (e) { /* no manifest.json (or it failed to load) — fall back to single-file defaults */ }

    const targets = [
      { key: 'words', label: 'words', apply: setCustomVocab },
      { key: 'grammar', label: 'grammar rules', apply: setCustomGrammar },
      { key: 'textbook', label: 'textbook chapters', apply: setCustomTextbook },
      { key: 'tips', label: 'tutor tips', apply: setCustomTips },
    ];

    const okMsgs = []; const missing = [];
    await Promise.all(targets.map(async (tgt) => {
      const files = fileMap[tgt.key] && fileMap[tgt.key].length ? fileMap[tgt.key] : DEFAULTS[tgt.key];
      const results = await Promise.allSettled(files.map(fetchJson));
      const combined = [];
      results.forEach((res, i) => {
        if (res.status === 'fulfilled' && Array.isArray(res.value)) {
          // Files listed later in the manifest's array win on id collisions,
          // so e.g. words4.json can deliberately patch an entry from words.json.
          res.value.forEach(item => {
            if (item && item.id) {
              const idx = combined.findIndex(c => c.id === item.id);
              if (idx >= 0) combined[idx] = item; else combined.push(item);
            }
          });
        } else {
          missing.push(files[i]);
        }
      });
      if (combined.length) {
        tgt.apply(prev => mergeById(prev, combined));
        okMsgs.push(`${combined.length} ${tgt.label} (${files.length} file${files.length > 1 ? 's' : ''})`);
      }
    }));

    setIsSyncing(false);
    if (okMsgs.length) {
      let msg = `Synced ${okMsgs.join(', ')}.`;
      if (missing.length) msg += ` (${missing.join(', ')} not found)`;
      showToast(msg, 'success');
    } else showToast(`Cloud sync failed for ${repoUser}/${repoName}.`, 'error');
  };

  const finishImport = (count, label) => {
    if (count > 0) { setImportText(''); setShowImportModal(false); showToast(`Saved ${count} ${label}.`, 'success'); }
    else showToast('No valid lines found — check the format.', 'error');
  };
  const handleImport = () => {
    if (!importText.trim()) return;
    const lines = importText.split('\n').map(l => l.trim()).filter(Boolean);
    if (activeModule === 'vocab') {
      const items = lines.map((line, idx) => {
        const [w, tr, p, g, ex] = line.split(',').map(s => (s || '').trim());
        if (!w || !tr) return null;
        return { id: `v-imp-${Date.now()}-${idx}`, level, category: 'imported', word: w, phonetic: p || '[import]', translation: { EN: tr, RU: tr }, gender: (g || '').toLowerCase() || undefined, examples: ex ? ex.split(';').map(s => s.trim()) : undefined };
      }).filter(Boolean);
      if (items.length) setCustomVocab(prev => [...items, ...prev]);
      finishImport(items.length, 'words');
    } else if (activeModule === 'grammar') {
      const items = lines.map((line, idx) => {
        const [title, theory, prompt, answer, opts] = line.split('|').map(s => (s || '').trim());
        if (!title || !answer) return null;
        const options = opts ? opts.split('~').map(s => s.trim()) : null;
        return { id: `g-imp-${Date.now()}-${idx}`, level, category: 'Custom', title: { EN: title, RU: title }, theory: { EN: theory || '', RU: theory || '' }, type: options ? 'mcq' : 'fill', prompt: prompt || '', answer, options: options || undefined };
      }).filter(Boolean);
      if (items.length) setCustomGrammar(prev => [...items, ...prev]);
      finishImport(items.length, 'grammar rules');
    } else if (activeModule === 'textbook') {
      const items = lines.map((line, idx) => {
        const [title, description, fileUrl] = line.split('|').map(s => (s || '').trim());
        if (!title || !fileUrl) return null;
        return { id: `tb-imp-${Date.now()}-${idx}`, level, category: 'chapters', title: { EN: title, RU: title }, description: { EN: description || '', RU: description || '' }, fileUrl };
      }).filter(Boolean);
      if (items.length) setCustomTextbook(prev => [...items, ...prev]);
      finishImport(items.length, 'textbook chapters');
    } else if (activeModule === 'tips') {
      const items = lines.map((line, idx) => {
        const [title, body, audioUrl, imageUrl, category] = line.split('|').map(s => (s || '').trim());
        if (!title || !body) return null;
        return { id: `tip-imp-${Date.now()}-${idx}`, level, category: category || 'general', title: { EN: title, RU: title }, body: { EN: body, RU: body }, audioUrl: audioUrl || '', imageUrl: imageUrl || '' };
      }).filter(Boolean);
      if (items.length) setCustomTips(prev => [...items, ...prev]);
      finishImport(items.length, 'tips');
    }
  };

  const openModule = (key) => {
    setActiveModule(key); setActiveCategory(null); setVocabMode(null);
    setVocabDetailOpen(false); setTextbookViewerOpen(false); setCurrentItem(null);
    setSearchQuery(''); setCategoryFilter('all'); setShowImportModal(false); setImportText('');
  };
  const openGrammarItem = (item) => { setCurrentItem(item); setGrammarPhase('theory'); setFeedback(null); setUserInput(''); setMcqChoice(null); };
  const openVocabDetail = (item) => { setCurrentItem(item); setVocabDetailOpen(true); };
  const openTextbook = (item) => { setCurrentItem(item); setTextbookViewerOpen(true); };

  const handleCheckFill = () => {
    if (!currentItem) return;
    const ok = userInput.toLowerCase().trim() === (currentItem.answer || '').toLowerCase();
    setFeedback({ correct: ok, msg: ok ? 'Correct! Świetnie! 🎉' : `Try again — answer: ${currentItem.answer}` });
    if (ok) markMastered(currentItem.id);
  };
  const handleMcqPick = (opt) => {
    if (mcqChoice) return;
    setMcqChoice(opt);
    const ok = opt === currentItem.answer;
    setFeedback({ correct: ok, msg: ok ? 'Correct! Świetnie! 🎉' : `Correct answer: ${currentItem.answer}` });
    if (ok) markMastered(currentItem.id);
  };

  // Flashcards
  const vocabDeck = filteredList;
  const currentCard = vocabDeck[flashIndex] || null;
  const startFlashSession = () => {
    setVocabMode('flash'); setFlashIndex(0); setFlashFlipped(false);
    setSessionMastered(new Set()); setSessionFailed(new Set()); setDeckDone(false);
  };
  const goFlash = (dir) => {
    setFlashFlipped(false); setDragX(0);
    setFlashIndex(i => {
      const n = vocabDeck.length; if (!n) return 0;
      return (i + dir + n) % n;
    });
  };
  const reviewCard = (outcome) => {
    if (!currentCard) return;
    if (outcome === 'master') { markMastered(currentCard.id); setSessionMastered(s => new Set(s).add(currentCard.id)); }
    else { setSessionFailed(s => new Set(s).add(currentCard.id)); }
    setFlashFlipped(false); setDragX(0);
    if (flashIndex >= vocabDeck.length - 1) setDeckDone(true);
    else setFlashIndex(i => i + 1);
  };
  const swipeMastered = () => reviewCard('master');
  const swipeSkip = () => reviewCard('skip');
  const restartDeck = () => { setFlashIndex(0); setFlashFlipped(false); setSessionMastered(new Set()); setSessionFailed(new Set()); setDeckDone(false); };
  const onDragStart = (e) => { dragging.current = true; dragStartX.current = (e.touches ? e.touches[0].clientX : e.clientX); };
  const onDragMove = (e) => { if (!dragging.current) return; const x = (e.touches ? e.touches[0].clientX : e.clientX); setDragX(x - dragStartX.current); };
  const onDragEnd = () => {
    if (!dragging.current) return; dragging.current = false;
    if (dragX > 90) swipeMastered(); else if (dragX < -90) swipeSkip(); else setDragX(0);
  };

  const renderTopBar = () => (
    <div className="glass topbar-compact">
      <div className="brand"><span className="flag">🇵🇱</span> Polska</div>
      <select className="field select-narrow level-select" value={level} onChange={e => setLevel(e.target.value)}>
        {['ALL', 'A1', 'A2', 'B1'].map(l => <option key={l} value={l}>{l === 'ALL' ? ui('allOption', baseLang) : l}</option>)}
      </select>
      <div className="lang-toggle">
        <button className={baseLang === 'EN' ? 'active' : ''} onClick={() => setBaseLang('EN')}>EN</button>
        <button className={baseLang === 'RU' ? 'active' : ''} onClick={() => setBaseLang('RU')}>RU</button>
      </div>
    </div>
  );

  const renderProfileHub = () => (
    <div className="pad" style={accentVars}>
      <div className="section-header"><h2>{t(MODULES.find(m => m.key === 'profile').label, baseLang)}</h2></div>
      <div className="profile-grid">
        <div className="glass-hi profile-stat"><i className="ph-fill ph-flame"></i><span className="mono">{streak.count}</span><small>{ui('dayStreak', baseLang)}</small></div>
        <div className="glass-hi profile-stat"><i className="ph-fill ph-seal-check"></i><span className="mono">{progressPct}%</span><small>{ui('masteredLbl', baseLang)}</small></div>
        <div className="glass-hi profile-stat"><i className="ph-fill ph-graduation-cap"></i><span className="mono">{level}</span><small>{ui('levelLbl', baseLang)}</small></div>
        <div className="glass-hi profile-stat"><i className="ph-fill ph-cards"></i><span className="mono">{mastered.size}</span><small>/{totalItems}</small></div>
      </div>
      <button className="glass-btn primary block" style={{ marginTop: 18 }} disabled={isSyncing} onClick={handleCloudSync}>
        <i className={`ph ${isSyncing ? 'ph-spinner ph-spin' : 'ph-cloud-arrow-down'}`}></i> {isSyncing ? ui('syncing', baseLang) : ui('syncFromCloud', baseLang)}
      </button>
    </div>
  );

  const renderDock = () => (
    <nav className="dock glass">
      {MODULES.map(m => (
        <button key={m.key} className={`dock-item ${activeModule === m.key ? 'active' : ''}`}
          style={activeModule === m.key ? { color: m.a } : undefined}
          onClick={() => openModule(m.key)} aria-current={activeModule === m.key ? 'page' : undefined}>
          <i className={`ph ${activeModule === m.key ? m.icon.replace('ph-', 'ph-fill ph-') : m.icon}`}></i>
          <span>{t(m.label, baseLang)}</span>
        </button>
      ))}
    </nav>
  );


  const renderImportModal = () => (
    <div className="glass import-modal glass-tight">
      <p className="modal-hint">{FORMAT_HINTS[activeModule]}</p>
      <textarea className="field textarea" rows="5" value={importText} onChange={e => setImportText(e.target.value)} placeholder={FORMAT_EXAMPLES[activeModule]} style={{ marginBottom: 10 }} />
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="glass-btn primary" style={accentVars} onClick={handleImport}>{ui('save', baseLang)}</button>
        <button className="glass-btn ghost" onClick={() => { setShowImportModal(false); setImportText(''); }}>{ui('cancel', baseLang)}</button>
      </div>
    </div>
  );

  const renderGrammarHub = () => {
    if (!activeCategory) {
      return (
        <div className="pad">
          <div className="section-header"><h2>{ui('grammarCategories', baseLang)}</h2></div>
          <div className="toolbar"><button className="glass-btn ghost" onClick={() => setShowImportModal(s => !s)}>{ui('batchImport', baseLang)}</button></div>
          {showImportModal && renderImportModal()}
          <div className="category-grid" style={{ marginTop: 10 }}>
            {categories.length === 0 && <p className="empty-note">{ui('noGrammarItems', baseLang, { level })}</p>}
            {categories.map((cat, i) => (
              <div key={cat} className="glass category-tile glass-tight" style={{ ...accentVars, '--i': i }}
                role="button" tabIndex={0} onClick={() => setActiveCategory(cat)} onKeyDown={keyActivate(() => setActiveCategory(cat))}>
                {cat}
              </div>
            ))}
          </div>
        </div>
      );
    }
    return (
      <div className="pad">
        <button className="back-link" onClick={() => setActiveCategory(null)}>{ui('categoriesBack', baseLang)}</button>
        <div className="section-header"><h2>{activeCategory}</h2></div>
        <div className="list-scroll">
          {filteredList.map(item => (
            <div key={item.id} className="glass-row" role="button" tabIndex={0} onClick={() => openGrammarItem(item)} onKeyDown={keyActivate(() => openGrammarItem(item))}>
              <div><strong>{t(item.title, baseLang)} {mastered.has(item.id) && <span className="mastered-check">✓</span>}</strong><div className="sub">{item.type === 'mcq' ? ui('multipleChoice', baseLang) : ui('typeInLbl', baseLang)}</div></div>
              <span className="chev">›</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderGrammarDetail = () => {
    const item = currentItem;
    if (grammarPhase === 'theory') {
      return (
        <div className="theory-card screen">
          <h3>{t(item.title, baseLang)}</h3>
          {item.questions && <div className="grammar-questions"><i className="ph ph-question"></i>{item.questions}</div>}
          <p className="theory-body">{t(item.theory, baseLang)}</p>
          {item.phoneticNote && <p className="phonetic-note"><i className="ph ph-speaker-high"></i>{item.phoneticNote}</p>}
          {item.example && (
            <div className="grammar-example">
              <p className="ex-pl">{item.example.pl}</p>
              <p className="ex-tr">{t(item.example.translation, baseLang)}</p>
            </div>
          )}
          <button className="glass-btn primary" style={accentVars} onClick={() => setGrammarPhase('practice')}>{ui('continueToPractice', baseLang)}</button>
        </div>
      );
    }
    return (
      <div className="split screen">
        <div className="glass theory-pane glass-tight">
          <h4>{t(item.title, baseLang)}</h4>
          {item.questions && <div className="grammar-questions"><i className="ph ph-question"></i>{item.questions}</div>}
          <p>{t(item.theory, baseLang)}</p>
          {item.phoneticNote && <p className="phonetic-note"><i className="ph ph-speaker-high"></i>{item.phoneticNote}</p>}
          {item.example && (
            <div className="grammar-example">
              <p className="ex-pl">{item.example.pl}</p>
              <p className="ex-tr">{t(item.example.translation, baseLang)}</p>
            </div>
          )}
        </div>
        <div className="glass practice-pane glass-tight">
          <p className="prompt-text">{item.prompt}</p>
          {item.type === 'mcq' ? (
            <div className="mcq-options">
              {(item.options || []).map(opt => {
                let cls = 'mcq-option';
                if (mcqChoice) { if (opt === item.answer) cls += ' correct'; else if (opt === mcqChoice) cls += ' incorrect'; }
                return <button key={opt} className={cls} onClick={() => handleMcqPick(opt)}>{opt}</button>;
              })}
            </div>
          ) : (
            <>
              <input className="field" value={userInput} onChange={e => setUserInput(e.target.value)} placeholder={ui('typeYourAnswer', baseLang)} onKeyDown={e => e.key === 'Enter' && handleCheckFill()} style={{ marginBottom: 10 }} />
              <button className="glass-btn primary block" style={accentVars} onClick={handleCheckFill}>{ui('checkAnswer', baseLang)}</button>
            </>
          )}
          {feedback && <p className={`feedback ${feedback.correct ? 'ok' : 'bad'}`}>{feedback.msg}</p>}
        </div>
      </div>
    );
  };

  const renderVocabHub = () => {
    if (!vocabMode) {
      return (
        <div className="pad">
          <div className="section-header"><h2>{ui('vocabularyTitle', baseLang)}</h2></div>
          <div className="toolbar"><button className="glass-btn ghost" onClick={() => setShowImportModal(s => !s)}>{ui('batchImport', baseLang)}</button></div>
          {showImportModal && renderImportModal()}
          {wordOfDay && (
            <div className="glass-hi wotd" style={accentVars}>
              <div className="wotd-tag"><span className="dot" style={{ background: 'var(--accent-a)' }}></span>{ui('wordOfDay', baseLang)}</div>
              <div className="wotd-word">{wordOfDay.word}</div>
              {wordOfDay.phonetic && <div className="wotd-phonetic">{wordOfDay.phonetic}</div>}
              <span className="wotd-translation" style={{ color: 'var(--accent-a)', background: 'color-mix(in srgb, var(--accent-a) 18%, transparent)', borderColor: 'color-mix(in srgb, var(--accent-a) 40%, transparent)' }}>{t(wordOfDay.translation, baseLang)}</span>
              {wordOfDay.examples && wordOfDay.examples[0] && <p className="wotd-sentence">{wordOfDay.examples[0]}</p>}
            </div>
          )}
          <div className="glass vocab-progress glass-tight" style={accentVars}>
            <div className="vocab-progress-top">
              <span>{ui('masteredLbl', baseLang)}</span>
              <span className="mono">{vocabMasteredCount} / {masterVocab.length}</span>
            </div>
            <div className="progress-track"><div className="progress-fill" style={{ width: `${vocabProgressPct}%`, background: 'var(--accent-a)' }}></div></div>
          </div>
          <div className="two-col-choice">
            <div className="glass choice-card" style={accentVars} role="button" tabIndex={0}
              onClick={startFlashSession} onKeyDown={keyActivate(startFlashSession)}>
              <i className="icon ph ph-cards"></i><span className="title">{ui('flashcards', baseLang)}</span>
            </div>
            <div className="glass choice-card" style={accentVars} role="button" tabIndex={0}
              onClick={() => setVocabMode('list')} onKeyDown={keyActivate(() => setVocabMode('list'))}>
              <i className="icon ph ph-list-bullets"></i><span className="title">{ui('listOfWords', baseLang)}</span>
            </div>
          </div>
        </div>
      );
    }
    if (vocabMode === 'flash') {
      if (!vocabDeck.length) return <div className="pad"><button className="back-link" onClick={() => setVocabMode(null)}>{ui('back', baseLang)}</button><p className="empty-note">{ui('noWordsYetAt', baseLang, { level })}</p></div>;
      if (deckDone) {
        return (
          <div className="pad">
            <button className="back-link" onClick={() => setVocabMode(null)}>{ui('back', baseLang)}</button>
            <div className="glass-hi deck-complete screen">
              <i className="ph-fill ph-confetti"></i>
              <h2>{ui('deckCompleteTitle', baseLang)}</h2>
              <div className="deck-complete-stats">
                <div><span className="mono">{sessionMastered.size}</span><small>{ui('masteredLbl', baseLang)}</small></div>
                <div><span className="mono">{sessionFailed.size}</span><small>{ui('toReviewLbl', baseLang)}</small></div>
              </div>
              <button className="glass-btn primary" style={accentVars} onClick={restartDeck}>{ui('studyAgain', baseLang)}</button>
              <button className="glass-btn ghost" onClick={() => setVocabMode(null)}>{ui('backToList', baseLang)}</button>
            </div>
          </div>
        );
      }
      const hue = FLASH_PALETTE[flashIndex % FLASH_PALETTE.length];
      const rot = Math.max(-14, Math.min(14, dragX / 10));
      return (
        <div className="flash-wrap">
          <button className="back-link" onClick={() => setVocabMode(null)}>{ui('back', baseLang)}</button>
          <div className="flash-deck"
            onMouseDown={onDragStart} onMouseMove={onDragMove} onMouseUp={onDragEnd} onMouseLeave={onDragEnd}
            onTouchStart={onDragStart} onTouchMove={onDragMove} onTouchEnd={onDragEnd}>
            {currentCard && (
              <div key={currentCard.id} className="flash-card-enter">
                <div className={`flash-card ${flashFlipped ? 'flipped' : ''} ${dragX > 40 ? 'tilt-good' : dragX < -40 ? 'tilt-bad' : ''}`} onClick={() => setFlashFlipped(f => !f)}
                  style={{ transform: `translateX(${dragX}px) rotate(${rot}deg) ${flashFlipped ? 'rotateY(180deg)' : ''} scale(${dragging.current ? 1.03 : 1})`, transition: dragging.current ? 'none' : undefined }}>
                  <div className="flash-face front" style={{ background: `linear-gradient(145deg, ${hue[0]}, ${hue[1]})`, boxShadow: `0 26px 55px ${hue[0]}55, inset 0 1px 0 rgba(255,255,255,.35)` }}>
                    {currentCard.gender && <span className="gender-badge">{GENDER_LABEL[currentCard.gender] || currentCard.gender}</span>}
                    <h2 className="word">{currentCard.word}</h2>
                    <div className="phonetic">{currentCard.phonetic}</div>
                  </div>
                  <div className="flash-face back" style={{ background: `linear-gradient(145deg, ${hue[1]}, ${hue[0]})`, boxShadow: `0 26px 55px ${hue[0]}55, inset 0 1px 0 rgba(255,255,255,.35)` }}>
                    <div className="translation">{t(currentCard.translation, baseLang)}</div>
                    {currentCard.examples && <div className="examples">{currentCard.examples.join(' · ')}</div>}
                    <a className="wsjp-link" href="https://wsjp.pl/" target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}>
                      <i className="ph ph-arrow-square-out"></i> {ui('wsjpLink', baseLang)}
                    </a>
                  </div>
                </div>
              </div>
            )}
          </div>
          <div className="flash-controls">
            <button className="icon-btn bad" onClick={swipeSkip} title={ui('markSkip', baseLang)}><i className="ph ph-x"></i></button>
            <span className="flash-progress mono">{flashIndex + 1} / {vocabDeck.length}</span>
            <button className="icon-btn good" onClick={swipeMastered} title={ui('markMastered', baseLang)}><i className="ph ph-check"></i></button>
          </div>
          <div className="flash-controls" style={{ marginTop: 4 }}>
            <button className="icon-btn ghost-nav" onClick={() => goFlash(-1)}>‹</button>
            <button className="icon-btn ghost-nav" onClick={() => goFlash(1)}>›</button>
          </div>
          <p className="empty-note">{ui('flipHint', baseLang)}</p>
        </div>
      );
    }
    return (
      <div className="pad">
        <button className="back-link" onClick={() => setVocabMode(null)}>{ui('back', baseLang)}</button>
        <div className="filter-row">
          <input className="field" placeholder={ui('searchWords', baseLang)} value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
          {categories.length > 1 && (
            <select className="field select-narrow" value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
              <option value="all">{ui('allOption', baseLang)}</option>
              {categories.map(c => <option key={c} value={c}>{CATEGORY_LABEL[c] ? t(CATEGORY_LABEL[c], baseLang) : c}</option>)}
            </select>
          )}
        </div>
        <div className="list-scroll">
          {filteredList.length === 0 && <p className="empty-note">{ui('noWordsFound', baseLang)}</p>}
          {filteredList.map(item => (
            <div key={item.id} className="glass-row" role="button" tabIndex={0} onClick={() => openVocabDetail(item)} onKeyDown={keyActivate(() => openVocabDetail(item))}>
              <div><strong>{item.word}</strong><div className="sub">{t(item.translation, baseLang)}</div></div>
              <a className="wsjp-chip" href="https://wsjp.pl/" target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()} title={ui('wsjpLink', baseLang)}>
                <i className="ph ph-arrow-square-out"></i>
              </a>
              <span className="chev">›</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderVocabDetail = () => {
    const item = currentItem;
    return (
      <div className="vocab-detail screen">
        <button className="back-link" onClick={() => { setVocabDetailOpen(false); setCurrentItem(null); }}>{ui('backToList', baseLang)}</button>
        {item.gender && <span className="gender-pill">{GENDER_LABEL[item.gender] || item.gender}</span>}
        <h2 style={{ margin: '4px 0 4px', fontSize: 24 }}>{item.word}</h2>
        <div style={{ color: 'var(--ink-faint)', fontSize: 13, marginBottom: 10 }}>{item.phonetic}</div>
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 6 }}>{t(item.translation, baseLang)}</div>
        {(item.examples || []).map((ex, i) => <div key={i} className="example-line">{ex}</div>)}
        <a className="wsjp-link" href="https://wsjp.pl/" target="_blank" rel="noreferrer">
          <i className="ph ph-arrow-square-out"></i> {ui('wsjpLink', baseLang)}
        </a>
      </div>
    );
  };

  const renderTextbookHub = () => (
    <div className="pad">
      <div className="section-header"><h2>{ui('textbookLibrary', baseLang)}</h2></div>
      <div className="toolbar"><button className="glass-btn ghost" onClick={() => setShowImportModal(s => !s)}>{ui('batchImport', baseLang)}</button></div>
      {showImportModal && renderImportModal()}
      <div className="book-grid" style={{ marginTop: 10 }}>
        {filteredList.length === 0 && <p className="empty-note">{ui('noChaptersYetAt', baseLang, { level })}</p>}
        {filteredList.map((item, i) => (
          <div key={item.id} className="book-cover" style={{ background: `linear-gradient(150deg, ${ACCENT_HEX.textbook[0]}, ${ACCENT_HEX.textbook[1]})`, '--i': i }}
            role="button" tabIndex={0} onClick={() => openTextbook(item)} onKeyDown={keyActivate(() => openTextbook(item))}>
            <span className="level-chip mono">{item.level}</span>
            {item.category && <div className="b-category">{item.category}</div>}
            <div className="b-title">{t(item.title, baseLang)}</div>
            {item.description && <div className="b-desc">{t(item.description, baseLang)}</div>}
          </div>
        ))}
      </div>
    </div>
  );

  const renderTextbookViewer = () => {
    const item = currentItem;
    const raw = item.fileUrl || item.pdfUrl || '';
    const embed = normalizeViewerUrl(raw);
    const isValidRaw = /^https?:\/\//i.test(raw);
    return (
      <div className="viewer-wrap screen pad">
        <button className="back-link" onClick={() => { setTextbookViewerOpen(false); setCurrentItem(null); }}>{ui('libraryBack', baseLang)}</button>
        {item.category && <div className="viewer-category">{item.category}</div>}
        <h3 className="viewer-title">{t(item.title, baseLang)}</h3>
        {t(item.description, baseLang) && <p className="viewer-desc">{t(item.description, baseLang)}</p>}
        {embed && (
          <div className="viewer-frame-shell"><iframe src={embed} title={t(item.title, baseLang)} className="viewer-frame" /></div>
        )}
        {!embed && isValidRaw && (
          <p className="empty-note">{ui('cantEmbed', baseLang)}</p>
        )}
        {!raw && <p className="empty-note">{ui('noFileLinked', baseLang)}</p>}
        {isValidRaw && (
          <a className="glass-btn ghost" href={raw} target="_blank" rel="noreferrer">{ui('openInNewTab', baseLang)}</a>
        )}
      </div>
    );
  };

  const renderTipsHub = () => (
    <div className="pad">
      <div className="section-header"><h2>{ui('tutorTips', baseLang)}</h2></div>
      <div className="toolbar"><button className="glass-btn ghost" onClick={() => setShowImportModal(s => !s)}>{ui('batchImport', baseLang)}</button></div>
      {showImportModal && renderImportModal()}
      <div className="tips-feed">
        {filteredList.length === 0 && <p className="empty-note">{ui('noTipsYetAt', baseLang, { level })}</p>}
        {filteredList.map(item => (
          <div key={item.id} className="glass tip-card glass-tight" role="button" tabIndex={0} onClick={() => setActiveTip(item)} onKeyDown={keyActivate(() => setActiveTip(item))}>
            <div className="tip-thumb">{item.imageUrl ? <img src={item.imageUrl} alt="" /> : <i className="ph-fill ph-lightbulb"></i>}</div>
            <div><p className="tip-title">{t(item.title, baseLang)}</p><p className="tip-snippet">{t(item.body, baseLang).slice(0, 60)}{t(item.body, baseLang).length > 60 ? '…' : ''}</p></div>
          </div>
        ))}
      </div>
    </div>
  );

  const renderTipOverlay = () => {
    if (!activeTip) return null;
    const audio = normalizeAudioUrl(activeTip.audioUrl);
    return (
      <div className="tip-overlay" onClick={() => setActiveTip(null)}>
        <div className="glass tip-overlay-card glass-tight" onClick={e => e.stopPropagation()}>
          <button className="back-link" onClick={() => setActiveTip(null)}>{ui('closeBack', baseLang)}</button>
          {activeTip.imageUrl && <img className="tip-overlay-img" src={activeTip.imageUrl} alt="" />}
          <h3 style={{ margin: '0 0 10px' }}>{t(activeTip.title, baseLang)}</h3>
          <p className="tip-overlay-body">{t(activeTip.body, baseLang)}</p>
          {audio && <audio controls src={audio} className="audio-player" />}
        </div>
      </div>
    );
  };

  const renderModulePanel = () => {
    if (activeModule === 'grammar') {
      if (currentItem) return <div className="pad">
        <button className="back-link" onClick={() => setCurrentItem(null)}>{ui('back', baseLang)}</button>
        {renderGrammarDetail()}
      </div>;
      return renderGrammarHub();
    }
    if (activeModule === 'vocab') {
      if (vocabDetailOpen) return renderVocabDetail();
      return renderVocabHub();
    }
    if (activeModule === 'textbook') {
      if (textbookViewerOpen) return renderTextbookViewer();
      return renderTextbookHub();
    }
    if (activeModule === 'tips') return renderTipsHub();
    if (activeModule === 'profile') return renderProfileHub();
    return null;
  };

  if (!started) {
    return (
      <div id="app">
        <div className="mesh"><div className="blob-c"></div></div>
        <div className="start-screen">
          <div className="glass-hi start-card">
            <div className="avatar-ring"><i className="ph-fill ph-graduation-cap"></i></div>
            <h1 className="hero-title">Witaj z powrotem!</h1>
            <p className="hero-sub">{ui('heroSub', baseLang)}</p>
            <div className="start-stats">
              <div><span className="mono">{streak.count}</span><small>{ui('dayStreak', baseLang)}</small></div>
              <div><span className="mono">{progressPct}%</span><small>{ui('masteredLbl', baseLang)}</small></div>
              <div><span className="mono">{level}</span><small>{ui('levelLbl', baseLang)}</small></div>
            </div>
            <button className="glass-btn primary block" style={accentVars} onClick={() => setStarted(true)}>{ui('startLearning', baseLang)}</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div id="app">
      <div className="mesh"><div className="blob-c"></div></div>
      {renderTopBar()}
      <main className="view" key={activeModule} style={accentVars}>
        {renderModulePanel()}
      </main>
      {renderDock()}
      {toast && <div className={`glass toast glass-tight ${toast.tone === 'error' ? 'error' : ''}`}>{toast.message}</div>}
      {renderTipOverlay()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PolskaVault />);
</script>
</body>
</html>
